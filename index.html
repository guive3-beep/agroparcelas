<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#12321f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AgroParcelas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="AgroParcelas · gestión y visualización de áreas de cultivo sobre mapa satelital, sin cuentas ni claves">
<title>AgroParcelas · Gestión de áreas de cultivo</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f7a3f'/%3E%3Cpath d='M16 25V13M16 17c-4 0-6-2-6-5 4 0 6 2 6 5zM16 14c4 0 6-2 6-5-4 0-6 2-6 5z' stroke='%23d7f5c4' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<!-- ============================ BARRA SUPERIOR ============================ -->
<header class="topbar" id="topbar">
  <button class="icon-btn only-mobile" id="btn-menu" aria-label="Menú de parcelas">
    <span class="burger"></span>
  </button>

  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><path d="M16 28V12M16 18c-4.6 0-7-2.6-7-6.5 4.6 0 7 2.6 7 6.5zM16 15c4.6 0 7-2.6 7-6.5-4.6 0-7 2.6-7 6.5z" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round"/></svg>
    </span>
    <div class="brand-txt">
      <strong>AgroParcelas</strong>
      <input id="project-name" class="project-name" type="text" value="Mi proyecto agrícola" aria-label="Nombre del proyecto" spellcheck="false">
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="top-actions">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Buscar parcela, cultivo, árbol…" aria-label="Buscar">
    </div>
    <button class="btn btn-primary" id="btn-save" title="Descargar copia de respaldo (.txt) — los datos ya se guardan solos en este navegador">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">Guardar copia</span>
    </button>
    <button class="icon-btn" id="btn-open-file" title="Abrir un archivo de respaldo (.txt)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v10m0 0 3.5-3.5M12 13 8.5 9.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="btn-kml" title="Exportar el mapa a KML (Google Earth / My Maps)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7c0 4.4-4.6 9.7-6.4 11.6a.9.9 0 0 1-1.3 0C9.6 18.7 5 13.4 5 9a7 7 0 0 1 7-7Zm0 4.5A2.5 2.5 0 1 0 12 11.5 2.5 2.5 0 0 0 12 6.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="icon-btn" id="btn-xlsx" title="Resumen de cultivos y árboles (Excel/CSV)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M9 5v14M15 5v14" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="icon-btn" id="btn-dashboard" title="Panel de control">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="btn-new" title="Proyecto nuevo (borra los datos actuales)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn only-mobile" id="btn-panel-right" title="Información del elemento">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10v6M12 7.4v.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="save-state" id="save-state" aria-live="polite"></div>

<!-- ============================== APLICACIÓN ============================== -->
<main class="app" id="app">

  <!-- ------------------------ PANEL IZQUIERDO ------------------------ -->
  <aside class="panel panel-left" id="panel-left">
    <div class="panel-head">
      <span class="panel-title">Explorador</span>
      <button class="icon-btn sm only-mobile" data-close-panel="left" aria-label="Cerrar">✕</button>
    </div>

    <div class="tools" id="tools">
      <button class="tool" data-action="draw-sub" title="Dibujar una nueva subparcela">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 17 8 5l7 3 5-2-3 12-8-1-5-4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Subparcela</span>
      </button>
      <button class="tool" data-action="draw-terreno" title="Delimitar el terreno general">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2"/><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".35"/></svg>
        <span>Terreno</span>
      </button>
      <button class="tool" data-action="place-tree" title="Colocar un árbol en el mapa">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 21v-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Árbol</span>
      </button>
      <button class="tool" data-action="measure" title="Medir superficie y perímetro">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 15h18M7 15v-3m5 3v-4m5 4v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Medir</span>
      </button>
      <button class="tool" data-action="fit" title="Ver todo el terreno">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Ver todo</span>
      </button>
      <button class="tool" data-action="locate" title="Centrar en mi ubicación (pide permiso al navegador)">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Mi GPS</span>
      </button>
    </div>

    <div class="visibility-controls" aria-label="Visibilidad del mapa">
      <button class="visibility-btn" type="button" data-visibility="parcelas" aria-pressed="true" title="Ocultar o mostrar todas las parcelas">
        <span>Ocultar parcelas</span>
      </button>
      <button class="visibility-btn" type="button" data-visibility="arboles" aria-pressed="true" title="Ocultar o mostrar todos los árboles">
        <span>Ocultar árboles</span>
      </button>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab is-active" data-tab="subparcelas">Parcelas <span class="count" id="c-sub">0</span></button>
      <button class="tab" data-tab="cultivos">Cultivos <span class="count" id="c-cul">0</span></button>
      <button class="tab" data-tab="arboles">Árboles <span class="count" id="c-arb">0</span></button>
    </div>

    <div class="list-scroll" id="list-scroll">
      <div id="list"></div>
    </div>

    <div class="panel-foot">
      <div class="drive-status">
        <span class="dot on"></span>
        <span id="storage-text">Guardado automático en este navegador</span>
      </div>
      <button class="btn btn-ghost sm" id="btn-open-file-2">Abrir archivo</button>
    </div>
  </aside>

  <!-- ---------------------------- MAPA ---------------------------- -->
  <section class="map-wrap" id="map-wrap">
    <div id="map"></div>

    <div class="map-overlay-top">
      <div class="mode-bar" id="mode-bar" hidden>
        <span class="mode-txt" id="mode-txt"></span>
        <button class="btn btn-primary sm" data-action="finish-draw">Terminar</button>
        <button class="btn btn-ghost sm" data-action="cancel-draw">Cancelar</button>
      </div>
      <div class="map-badges" id="map-badges">
        <span class="badge-sat">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 0c3 3 3 17 0 20M2.5 9h19M2.5 15h19" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          Vista satelital · zoom hasta nivel 25
        </span>
      </div>
    </div>

    <div class="measure-card" id="measure-card" hidden>
      <button class="icon-btn sm" data-action="close-measure" aria-label="Cerrar">✕</button>
      <h4>Medición</h4>
      <dl>
        <dt>Superficie</dt><dd id="m-area">—</dd>
        <dt>Perímetro</dt><dd id="m-per">—</dd>
        <dt>Vértices</dt><dd id="m-vtx">—</dd>
      </dl>
      <p class="hint">Haga clic para agregar vértices · doble clic cierra</p>
    </div>

    <div class="legend" id="legend">
      <button class="legend-toggle" id="legend-toggle" aria-expanded="false">
        <span>Leyenda</span><span class="chev">▾</span>
      </button>
      <div class="legend-body" id="legend-body"></div>
    </div>

    <div class="map-hint only-mobile" id="map-hint">Toca para seleccionar · usa dos dedos para mover</div>
  </section>

  <!-- ------------------------ PANEL DERECHO ------------------------ -->
  <aside class="panel panel-right" id="panel-right">
    <div class="panel-head">
      <span class="panel-title" id="right-title">Detalle</span>
      <button class="icon-btn sm only-mobile" data-close-panel="right" aria-label="Cerrar">✕</button>
    </div>
    <div class="detail-scroll" id="detail"></div>
  </aside>
</main>

<div class="backdrop" id="backdrop" hidden></div>

<!-- Selector de archivo de respaldo -->
<input type="file" id="file-open" accept=".txt,.json,application/json,text/plain" hidden>

<!-- ============================== MODALES ============================== -->
<div class="modal-root" id="modal-root" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modal-title">Título</h3>
      <button class="icon-btn sm" data-close-modal aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Confirmación -->
<div class="modal-root" id="confirm-root" hidden>
  <div class="modal-backdrop" data-close-confirm></div>
  <div class="modal modal-sm">
    <div class="modal-head"><h3 id="confirm-title">Confirmar</h3></div>
    <div class="modal-body"><p id="confirm-msg"></p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close-confirm>Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Eliminar</button>
    </div>
  </div>
</div>

<!-- ============================== SCRIPTS ============================== -->
<script src="vendor/leaflet.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/geo.js"></script>
<script src="js/store.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/files.js"></script>
<script src="js/forms.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
<script>
  // El registro requiere HTTPS o localhost.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
        .catch(function (error) { console.warn("No se pudo registrar el modo PWA:", error); });
    });
  }
</script>
</body>
</html>
